<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John-Wave21314</title>
    <style>
        @keyframes fadein {
            100% {
                opacity: 1;
                transform:translate(17vw,3ch);
            }
        }
        body {
            color: white;
            background-color: black;
            font-size: 2rem;
            font-family: "Roboto", sans-serif;
        }
        #box {
            height: 100vh;
            width: 90vw;
            border-style: solid;
            border-color: white;
            border-width: 10px;
            position: absolute;
            display: flex;
            justify-content: flex-start;
        }
        #box2 {
            background-image:url(https://i.redd.it/ae9xnw5adq5h1.png);
            height: 489px;
            width: 364px;
            position: absolute;
            transform: scale(50%,50%) translate(-45%,-45%);
        }
        #box3 {
            height:100vh;
            width: 70vw;
            position: absolute;
            transform: translate(17vw,0vh);
            opacity: 0;
            animation-name: fadein;
            animation-duration:0.6s;
            animation-fill-mode: forwards;

        } 
    </style>
</head>
<body>
    <h1>John-Wave21314</h1>
    <div id="box">
        <div id="box2"></div>
        <div id="box3">Hello, my name is John G. Wave and I am the creator of the Wave gamemode in the hit platformer Geometry Dash. I made this website to show my other acts of greatness, and to maybe ask questions.</div>
    </div>
</body>
</html>
